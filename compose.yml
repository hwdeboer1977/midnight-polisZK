# NOTE: the proof-server service is deliberately not part of this stack.
# It fails to fetch key material from srs.midnight.network when started
# by compose, but works fine as a standalone container. Run it once with:
#
#   docker run -d --name proof-server --restart unless-stopped \
#     -p 6300:6300 midnightntwrk/proof-server:8.1.0 midnight-proof-server -v
#
# It then survives reboots and Docker restarts; the app reaches it at
# localhost:6300 from the host, so it does not need to share this network.

services:
  indexer:
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

  # Platform bookkeeping: which company registered, when, for how long, and
  # whether they are still active.
  #
  # Deliberately separate from the chain and never authoritative over it. The
  # contracts remain the only answer to "who controls this payroll"; this records
  # the commercial relationship around it, which is not a thing a contract knows
  # about. Reading ownership from here instead would reintroduce exactly the bug
  # where a stale row outranks what the contract says.
  #
  # Credentials are local-only defaults and the port is bound to 127.0.0.1: this
  # is a demo database, not one to expose.
  postgres:
    image: 'postgres:17'
    ports:
      - '127.0.0.1:5436:5432'
    environment:
      POSTGRES_USER: 'polis'
      POSTGRES_PASSWORD: 'polis'
      POSTGRES_DB: 'polis'
    volumes:
      - polis-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polis -d polis']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  polis-db:
