<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 526" width="740" height="526" role="img" aria-label="A sealed salary history feeds a zero-knowledge proof that establishes five facts about a claim; the fund learns only that the claim is valid, the month, and one nullifier, while the benefit amount and the claimant stay sealed, and only pooled aggregates are public" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ink   { fill: #16213E; }
      .seal  { fill: #3D4F7C; }
      .hair  { stroke: #C3CCDC; stroke-width: 1; }
      .box   { fill: none; stroke: #16213E; stroke-width: 2; }
      .amber { fill: #E8A33D; }
      .go    { fill: #2E8B6F; }
      .goS   { stroke: #2E8B6F; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .flow  { stroke: #3D4F7C; stroke-width: 2; fill: none; stroke-linecap: round; }
      .t     { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #16213E; }
      .num   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 17px; font-weight: 600; }
      .meta  { font-size: 12px; fill: #6B7A96; }
      .head  { font-size: 10.5px; letter-spacing: 0.08em; fill: #6B7A96; }
      .lab   { font-size: 12px; fill: #16213E; }
      .val   { font-size: 14px; font-weight: 600; }
      .leg   { font-size: 11.5px; fill: #4A5A78; }
    </style>
  </defs>

  <rect x="0" y="0" width="740" height="526" fill="#FFFFFF"/>

  <text class="t title" x="40" y="40">Unemployment claim · what each party learns</text>
  <text class="t meta" x="40" y="59">neither the salary history nor the benefit is ever disclosed</text>

  <text class="t head" x="40" y="94">SALARY HISTORY</text>
  <text class="t meta" x="40" y="110">one month’s sealed opening</text>
  <g class="seal">
    <rect x="40" y="124" width="20" height="20" rx="3"/><rect x="68" y="124" width="20" height="20" rx="3"/><rect x="96" y="124" width="20" height="20" rx="3"/><rect x="124" y="124" width="20" height="20" rx="3"/>
    <rect x="40" y="152" width="20" height="20" rx="3"/><rect x="68" y="152" width="20" height="20" rx="3"/><rect x="96" y="152" width="20" height="20" rx="3"/><rect x="124" y="152" width="20" height="20" rx="3"/>
    <rect x="40" y="180" width="20" height="20" rx="3"/><rect x="68" y="180" width="20" height="20" rx="3"/><rect x="96" y="180" width="20" height="20" rx="3"/><rect x="124" y="180" width="20" height="20" rx="3"/>
    <rect x="40" y="208" width="20" height="20" rx="3"/><rect x="68" y="208" width="20" height="20" rx="3"/><rect x="96" y="208" width="20" height="20" rx="3"/><rect x="124" y="208" width="20" height="20" rx="3"/>
    <rect x="40" y="236" width="20" height="20" rx="3"/><rect x="68" y="236" width="20" height="20" rx="3"/><rect x="96" y="236" width="20" height="20" rx="3"/><rect x="124" y="236" width="20" height="20" rx="3"/>
    <rect x="40" y="264" width="20" height="20" rx="3"/><rect x="68" y="264" width="20" height="20" rx="3"/><rect x="96" y="264" width="20" height="20" rx="3"/><rect x="124" y="264" width="20" height="20" rx="3"/>
  </g>

  <path class="flow" d="M158 210 L206 210"/>
  <path class="flow" d="M206 210 L196 204 M206 210 L196 216"/>

  <rect class="box" x="222" y="112" width="256" height="192" rx="8"/>
  <text class="t head" x="240" y="136">THE PROOF ESTABLISHES</text>

  <path class="goS" d="M242 150 L248 156 L260 142"/>
  <text class="t lab" x="270" y="160">terminated in this month's set</text>
  <path class="goS" d="M242 178 L248 184 L260 170"/>
  <text class="t lab" x="270" y="188">minimum work history met</text>
  <path class="goS" d="M242 206 L248 212 L260 198"/>
  <text class="t lab" x="270" y="216">benefit derived from her salary</text>
  <path class="goS" d="M242 234 L248 240 L260 226"/>
  <text class="t lab" x="270" y="244">month within her entitlement</text>
  <path class="goS" d="M242 262 L248 268 L260 254"/>
  <text class="t lab" x="270" y="272">taxed under the same schedule</text>

  <path class="flow" d="M490 210 L538 210"/>
  <path class="flow" d="M538 210 L528 204 M538 210 L528 216"/>

  <rect x="552" y="112" width="148" height="192" rx="8" fill="#E8A33D" opacity="0.10"/>
  <rect x="552" y="112" width="148" height="192" rx="8" fill="none" stroke="#E8A33D" stroke-width="2"/>
  <text class="t head" x="568" y="136" fill="#B57917">THE FUND LEARNS</text>

  <path class="goS" d="M568 160 L574 166 L586 152"/>
  <text class="t lab" x="594" y="170" font-size="11.5">claim is valid</text>
  <path class="goS" d="M568 186 L574 192 L586 178"/>
  <text class="t lab" x="594" y="196" font-size="11.5">the month</text>
  <path class="goS" d="M568 212 L574 218 L586 204"/>
  <text class="t lab" x="594" y="222" font-size="11.5">one nullifier</text>

  <text class="t lab" x="568" y="244" font-size="10.5" fill="#6B7A96">benefit amount</text>
  <rect class="seal" x="568" y="252" width="88" height="13" rx="3"/>

  <text class="t lab" x="568" y="276" font-size="10.5" fill="#6B7A96">who claimed</text>
  <rect class="seal" x="568" y="284" width="62" height="13" rx="3"/>

  <text class="t meta" x="40" y="330" font-size="11">the amount, the salary behind it and the employer never cross</text>
  <text class="t meta" x="40" y="348" font-size="11">who claimed is visible to anyone already holding her payment address</text>
  <text class="t meta" x="40" y="366" font-size="11">this month’s set is assembled by a relay — that it mirrors payroll is publicly checkable, not proved</text>

  <line class="hair" x1="40" y1="388" x2="700" y2="388"/>

  <text class="t head" x="40" y="414">POOLED FUND · WHAT IS PUBLIC</text>

  <text class="t lab" x="40"  y="442" font-size="10.5" fill="#6B7A96">claims settled</text>
  <text class="t num val" x="40" y="464" fill="#16213E">6</text>
  <text class="t lab" x="62" y="464" font-size="11" fill="#6B7A96">a count, not an amount</text>

  <text class="t lab" x="250" y="442" font-size="10.5" fill="#6B7A96">fund balance</text>
  <text class="t lab" x="250" y="464" font-size="11">not published at all</text>

  <text class="t lab" x="400" y="442" font-size="10.5" fill="#6B7A96">tax withheld</text>
  <text class="t lab" x="400" y="464" font-size="11">a real total</text>

  <text class="t lab" x="560" y="442" font-size="10.5" fill="#6B7A96">contributions in</text>
  <text class="t lab" x="560" y="464" font-size="11">attributable by month</text>

  <text class="t meta" x="40" y="488" font-size="10.5">the fund is deliberately not publicly solvent — its balance is shielded, and publishing it would leak every benefit</text>

  <rect class="seal" x="40" y="506" width="24" height="10" rx="3"/>
  <text class="t leg" x="72" y="515">Private</text>
  <rect class="amber" x="140" y="506" width="24" height="10" rx="3"/>
  <text class="t leg" x="172" y="515">Public on chain</text>
  <rect class="go" x="272" y="506" width="24" height="10" rx="3"/>
  <text class="t leg" x="304" y="515">Proved, not revealed</text>
</svg>
