<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" role="img" aria-label="A payroll period in which every employee's gross, tax, social insurance contribution and net pay stays private, a sealed commitment for each employee is published on chain but readable by no one, and only the headcount and the four column totals are public" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ink    { fill: #16213E; }
      .seal   { fill: #3D4F7C; }
      .sealed { fill: #EDEAF7; stroke: #8B80C6; stroke-width: 0.75; }
      .hatchfill { fill: url(#hatch); }
      .hair   { stroke: #C3CCDC; stroke-width: 1; }
      .rule   { stroke: #16213E; stroke-width: 2; }
      .amber  { fill: #E8A33D; }
      .amberS { stroke: #E8A33D; stroke-width: 2; fill: none; }
      .t      { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #16213E; }
      .num    { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .head   { font-size: 11px; letter-spacing: 0.07em; fill: #6B7A96; }
      .headS  { font-size: 11px; letter-spacing: 0.07em; fill: #6F63A8; }
      .title  { font-size: 17px; font-weight: 600; }
      .meta   { font-size: 12px; fill: #6B7A96; }
      .tot    { font-size: 14px; font-weight: 600; }
      .totlab { font-size: 12px; font-weight: 600; fill: #16213E; }
      .leg    { font-size: 11.5px; fill: #4A5A78; }
    </style>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#8B80C6" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="508" fill="#FFFFFF"/>

  <text class="t title" x="40" y="40">Payroll · August 2026</text>
  <rect class="amberS" x="762" y="26" width="114" height="22" rx="11"/>
  <text class="t num" x="819" y="41" font-size="12" font-weight="600" fill="#B57917" text-anchor="middle">10 employees</text>
  <text class="t meta" x="40" y="60">one employer · one period</text>

  <text class="t head" x="40"  y="92">EMPLOYEE</text>
  <text class="t head" x="300" y="92" text-anchor="end">GROSS</text>
  <text class="t head" x="420" y="92" text-anchor="end">INCOME TAX</text>
  <text class="t head" x="560" y="92" text-anchor="end">SOCIAL INSURANCE</text>
  <text class="t head" x="690" y="92" text-anchor="end">NET PAY</text>
  <text class="t headS" x="876" y="92" text-anchor="end">SEALED ON CHAIN</text>
  <line class="hair" x1="40" y1="100" x2="876" y2="100"/>
  <line class="hair" x1="785" y1="84" x2="785" y2="368" stroke-dasharray="3 3"/>

  <g>
    <circle class="ink" cx="47" cy="118" r="6"/><rect class="seal" x="62" y="112" width="104" height="13" rx="3"/><rect class="seal" x="220" y="112" width="80" height="13" rx="3"/><rect class="seal" x="344" y="112" width="76" height="13" rx="3"/><rect class="seal" x="484" y="112" width="76" height="13" rx="3"/><rect class="seal" x="610" y="112" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="112" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="112" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="144" r="6"/><rect class="seal" x="62" y="138" width="82" height="13" rx="3"/><rect class="seal" x="220" y="138" width="80" height="13" rx="3"/><rect class="seal" x="344" y="138" width="76" height="13" rx="3"/><rect class="seal" x="484" y="138" width="76" height="13" rx="3"/><rect class="seal" x="610" y="138" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="138" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="138" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="170" r="6"/><rect class="seal" x="62" y="164" width="120" height="13" rx="3"/><rect class="seal" x="220" y="164" width="80" height="13" rx="3"/><rect class="seal" x="344" y="164" width="76" height="13" rx="3"/><rect class="seal" x="484" y="164" width="76" height="13" rx="3"/><rect class="seal" x="610" y="164" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="164" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="164" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="196" r="6"/><rect class="seal" x="62" y="190" width="96" height="13" rx="3"/><rect class="seal" x="220" y="190" width="80" height="13" rx="3"/><rect class="seal" x="344" y="190" width="76" height="13" rx="3"/><rect class="seal" x="484" y="190" width="76" height="13" rx="3"/><rect class="seal" x="610" y="190" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="190" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="190" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="222" r="6"/><rect class="seal" x="62" y="216" width="112" height="13" rx="3"/><rect class="seal" x="220" y="216" width="80" height="13" rx="3"/><rect class="seal" x="344" y="216" width="76" height="13" rx="3"/><rect class="seal" x="484" y="216" width="76" height="13" rx="3"/><rect class="seal" x="610" y="216" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="216" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="216" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="248" r="6"/><rect class="seal" x="62" y="242" width="76" height="13" rx="3"/><rect class="seal" x="220" y="242" width="80" height="13" rx="3"/><rect class="seal" x="344" y="242" width="76" height="13" rx="3"/><rect class="seal" x="484" y="242" width="76" height="13" rx="3"/><rect class="seal" x="610" y="242" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="242" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="242" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="274" r="6"/><rect class="seal" x="62" y="268" width="130" height="13" rx="3"/><rect class="seal" x="220" y="268" width="80" height="13" rx="3"/><rect class="seal" x="344" y="268" width="76" height="13" rx="3"/><rect class="seal" x="484" y="268" width="76" height="13" rx="3"/><rect class="seal" x="610" y="268" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="268" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="268" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="300" r="6"/><rect class="seal" x="62" y="294" width="88" height="13" rx="3"/><rect class="seal" x="220" y="294" width="80" height="13" rx="3"/><rect class="seal" x="344" y="294" width="76" height="13" rx="3"/><rect class="seal" x="484" y="294" width="76" height="13" rx="3"/><rect class="seal" x="610" y="294" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="294" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="294" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="326" r="6"/><rect class="seal" x="62" y="320" width="108" height="13" rx="3"/><rect class="seal" x="220" y="320" width="80" height="13" rx="3"/><rect class="seal" x="344" y="320" width="76" height="13" rx="3"/><rect class="seal" x="484" y="320" width="76" height="13" rx="3"/><rect class="seal" x="610" y="320" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="320" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="320" width="80" height="13" rx="3"/>
    <circle class="ink" cx="47" cy="352" r="6"/><rect class="seal" x="62" y="346" width="98" height="13" rx="3"/><rect class="seal" x="220" y="346" width="80" height="13" rx="3"/><rect class="seal" x="344" y="346" width="76" height="13" rx="3"/><rect class="seal" x="484" y="346" width="76" height="13" rx="3"/><rect class="seal" x="610" y="346" width="80" height="13" rx="3"/><rect class="sealed" x="796" y="346" width="80" height="13" rx="3"/><rect class="hatchfill" x="796" y="346" width="80" height="13" rx="3"/>
  </g>

  <line class="rule" x1="40" y1="376" x2="876" y2="376"/>

  <text class="t totlab" x="40" y="400">Period total</text>
  <text class="t num tot" x="300" y="400" text-anchor="end" fill="#B57917">€ 40 780.00</text>
  <text class="t num tot" x="420" y="400" text-anchor="end" fill="#B57917">€ 14 747.51</text>
  <text class="t num tot" x="560" y="400" text-anchor="end" fill="#B57917">€ 1 223.40</text>
  <text class="t num tot" x="690" y="400" text-anchor="end" fill="#B57917">€ 24 809.09</text>
  <text class="t num" x="876" y="400" text-anchor="end" font-size="12" font-weight="600" fill="#6F63A8">10 commitments</text>

  <text class="t meta" x="40" y="428" font-size="11">each employee is paid their net as a shielded coin — settled on chain, amount never visible</text>
  <text class="t meta" x="40" y="446" font-size="11">the sealed column is a commitment, an encrypted opening and a payee hash — one set per employee, per month</text>

  <rect class="seal" x="40" y="472" width="24" height="10" rx="3"/>
  <text class="t leg" x="72" y="481">Private — never published</text>

  <rect class="sealed" x="290" y="472" width="24" height="10" rx="3"/>
  <rect class="hatchfill" x="290" y="472" width="24" height="10" rx="3"/>
  <text class="t leg" x="322" y="481">Sealed on chain — binding, readable by no one</text>

  <rect class="amber" x="620" y="472" width="24" height="10" rx="3"/>
  <text class="t leg" x="652" y="481">Public on chain — provably correct</text>
</svg>
